<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Vochito Envíos y Ventas</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Hoja de Estilos Personalizada -->
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark sticky-top">
    <div class="container">
      <a class="navbar-brand text-white d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo.png" alt="Logo Vochito Envíos y Ventas" width="40" height="40" class="rounded-circle d-inline-block align-text-top">
        <span>Vochito Envíos y Ventas</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="nosotros.html">Nosotros</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contacto.html">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Encabezado de la página -->
    <header class="bg-primary text-white text-center py-5">
      <div class="container py-3">
        <h1 class="display-4 fw-bold">Ponte en Contacto</h1>
        <p class="lead">
          ¿Tienes dudas o quieres colaborar con artesanos locales? Escríbenos!!.
        </p>
      </div>
    </header>

    <!-- Formulario de Contacto con validaciones nativas -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 p-4">
            <h3 class="mb-4 text-center text-dark">Formulario de Contacto</h3>

            <form action="#" method="POST">
              <div class="mb-3">
                <label for="nombre" class="form-label fw-bold"
                  >Nombre Completo <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  name="nombre"
                  placeholder="Tu nombre y apellidos"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label fw-bold"
                  >Correo Electrónico <span class="text-danger">*</span></label
                >
                <input
                  type="email"
                  class="form-control"
                  id="correo"
                  name="correo"
                  placeholder="ejemplo@correo.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label fw-bold"
                  >Teléfono</label
                >
                <input
                  type="tel"
                  class="form-control"
                  id="telefono"
                  name="telefono"
                  placeholder="10 dígitos"
                />
              </div>

              <div class="mb-3">
                <label for="asunto" class="form-label fw-bold"
                  >Asunto <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="asunto"
                  name="asunto"
                  placeholder="Motivo de tu mensaje"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="mensaje" class="form-label fw-bold"
                  >Mensaje <span class="text-danger">*</span></label
                >
                <textarea
                  class="form-control"
                  id="mensaje"
                  name="mensaje"
                  rows="4"
                  placeholder="Escribe aquí tus dudas o comentarios..."
                  required
                ></textarea>
              </div>

              <div class="d-flex justify-content-between pt-3">
                <button type="reset" class="btn btn-outline-secondary px-4">
                  Limpiar
                </button>
                <button type="submit" class="btn btn-primary px-4">
                  Enviar Mensaje
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-custom-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <p class="mb-0 small">
          &copy; 2026 Raíces Digitales - Vochito Envíos y Ventas. Todos los
          derechos reservados.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!--JS personalizado -->
    <script src="js/main.js"></script>
  </body>
</html>
